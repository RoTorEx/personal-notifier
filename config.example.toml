data_dir = "/data"
runtime_dir = "/run/vibecoding"
token_file = "/config/token"
allowed_user_id = 123456789 # Replace with the existing verified numeric operator.
bot_username = "existing_bot_username"
web_url = "https://vibecoding.com"
host_id = "hz-fi-001"
core_enabled = false # Technical outcomes belong to Node Tools / Node Radar.
# Optional notification-only indoor climate connection:
# home_socket = "/run/node-tools/read.sock"
housing_usernames = [] # Optional housing-only users; first private /start pins their numeric ID.

[[sources]]
name = "housing"
socket = "/run/web-watch/api.sock"
poll_seconds = 900 # Quarter-hour wall-clock boundaries; source UI remains immediate.
queue = true # Owner-only review API; Core remains read-only.

